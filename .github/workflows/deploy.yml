name: Deploy

# Pages serves from the gh-pages branch (Pages source: gh-pages, path /), so this
# builds on every push to main and force-pushes build/ there. No third-party actions
# and no Pages reconfiguration needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # static/CNAME and static/.nojekyll are copied into build/ by adapter-static,
      # so the custom domain and Jekyll bypass survive each deploy.
      - name: Publish build/ to gh-pages
        run: |
          test -f build/CNAME || { echo "CNAME missing from build — refusing to deploy"; exit 1; }
          cd build
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      # Cloudflare only compresses responses it CACHES, so edge-caching the HTML is
      # the only way to stop serving it uncompressed (~34 KB/page). That is safe only
      # if a deploy also purges, otherwise a push stays invisible until the TTL runs
      # out and looks like a broken deploy. This step is that prerequisite.
      #
      # No-ops with a notice until both secrets exist, so the workflow is committed
      # ready rather than as a TODO:
      #   CLOUDFLARE_PURGE_TOKEN — API token, "Zone → Cache Purge" on this zone ONLY
      #   CLOUDFLARE_ZONE_ID     — the zone id (not a credential, but no reason to
      #                            put it in a public workflow file)
      #
      # A purge failure annotates rather than fails: the site is already deployed by
      # this point, so a red X would misreport a working deploy. The annotation still
      # shows up in the run summary.
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::notice::Cache purge skipped — CLOUDFLARE_PURGE_TOKEN / CLOUDFLARE_ZONE_ID not set."
            exit 0
          fi
          code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"purge_everything":true}')
          if [ "$code" = "200" ] && grep -q '"success":true' /tmp/purge.json; then
            echo "Cloudflare cache purged."
          else
            # Response body can echo the request, so report status only — never the body.
            echo "::error::Cloudflare cache purge failed (HTTP $code). Site is deployed; the edge may serve stale HTML until its TTL expires."
          fi

<!doctype html>
<!--
  Template for every social card. Not part of the built site.

  scripts/og.mjs clones this once per page with that page's headline, label and
  accent tint and screenshots each at 1200x630 into static/og/. Edit the design
  here, then re-run the script — do not hand-edit the PNGs.

    npx --yes playwright@latest install chromium
    node scripts/og.mjs

  static/og.png is the old single card, kept as the fallback for the two legal
  pages, which have no card of their own.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Anton';
				src: url('./node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2')
					format('woff2');
				font-weight: 400;
				font-display: block;
			}
			@font-face {
				font-family: 'Geist Mono';
				src: url('./node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2')
					format('woff2');
				font-weight: 400;
				font-display: block;
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #060606;
				color: #fff;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 72px 80px;
				overflow: hidden;
			}
			.top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-family: 'Geist Mono', monospace;
				font-size: 18px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: rgb(255 255 255 / 0.5);
			}
			.top b {
				color: #fff;
				font-weight: 400;
			}
			h1 {
				font-family: 'Anton', sans-serif;
				font-weight: 400;
				text-transform: uppercase;
				letter-spacing: -0.02em;
				line-height: 1.06;
				font-size: 96px;
				max-width: 18ch;
			}
			.rule {
				height: 1px;
				background: rgb(255 255 255 / 0.1);
				margin: 40px 0 32px;
			}
			.bottom {
				display: flex;
				align-items: center;
				gap: 16px;
				font-family: 'Geist Mono', monospace;
				font-size: 18px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: rgb(255 255 255 / 0.5);
			}
			.dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: #e1f435;
			}
		</style>
	</head>
	<body>
		<div class="top">
			<span><b>Moha Aghanoori</b></span>
			<span>moha.expert</span>
		</div>
		<div>
			<h1>The boring half of your job can do itself.</h1>
			<div class="rule"></div>
			<div class="bottom">
				<span class="dot"></span>
				<span>AI consulting &amp; coaching · Berlin · EN &amp; DE</span>
			</div>
		</div>
	</body>
</html>

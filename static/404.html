<!doctype html>
<!-- Served by GitHub Pages for any path that doesn't exist. Self-contained on
     purpose: the app's font and CSS files carry hashed names, so this page
     leans on system fonts and repeats the palette from src/app.css. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>404 — Moha Aghanoori</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#060606" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #060606;
				color: #fff;
				font-family: system-ui, -apple-system, sans-serif;
				line-height: 1.6;
			}
			main {
				max-width: 34rem;
				padding: 2rem 1.25rem;
			}
			.meta {
				font-family: ui-monospace, 'SF Mono', Menlo, monospace;
				font-size: 0.6875rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: rgb(255 255 255 / 0.5);
			}
			h1 {
				font-family: 'Arial Narrow', Impact, sans-serif;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: -0.02em;
				line-height: 1.06;
				font-size: clamp(2.5rem, 9vw, 4.5rem);
				margin: 0.75rem 0 1rem;
			}
			p {
				color: #bfbfbf;
				margin: 0 0 0.5rem;
			}
			p[lang='de'] {
				margin-bottom: 2rem;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
			}
			nav a {
				font-family: ui-monospace, 'SF Mono', Menlo, monospace;
				font-size: 0.75rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: #fff;
				text-decoration: none;
				border: 1px solid rgb(255 255 255 / 0.2);
				border-radius: 10px;
				padding: 0.95rem 1.5rem;
			}
			nav a:hover {
				border-color: #e1f435;
				color: #e1f435;
			}
			nav a.primary {
				background: #e1f435;
				border-color: #e1f435;
				color: #060606;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="meta">404</p>
			<h1>This page does not exist.</h1>
			<p>The address may have changed, or it never was. Everything real is one click away.</p>
			<p lang="de">Diese Seite gibt es nicht. Alles Echte ist einen Klick entfernt.</p>
			<nav>
				<a class="primary" href="/">Home</a>
				<a href="/work/">Use cases</a>
				<a href="/de/" lang="de">Deutsch</a>
			</nav>
		</main>
	</body>
</html>
